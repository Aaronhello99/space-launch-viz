<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Monitor System — Space Launch Analytics</title>
    <link rel="stylesheet" href="style.css">
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <canvas id="starfield"></canvas>

    <!-- Dashboard Control Panel (Bottom) -->
    <div id="narrator-area">
        <div class="dashboard-status">
            <div class="status-label">System Status</div>
            <div class="status-value">ONLINE</div>
        </div>
        <div class="alien-dialogue-box">
            <h3 id="alien-title">Mission Control</h3>
            <p id="alien-message">Initializing Orbital Visualization Sequence...</p>
        </div>
    </div>

    <!-- Slide Container -->
    <main id="slides-container">

        <!-- Slide 0: Intro (No Chart) -->
        <section class="slide active" id="slide-0" data-title="Mission Briefing">
            <div class="intro-content">
                <h1 class="glitch" data-text="Orbital Monitor System">Orbital Monitor System</h1>
                <h2 class="subtitle">Status: Online</h2>
                <div class="start-btn-container">
                    <button class="btn large" onclick="nextSlide()">Initialize Data Link ▶</button>
                </div>
            </div>
        </section>

        <!-- Slide 1: Viz 1 -->
        <section class="slide" id="slide-1" data-title="Temporal Analysis">
            <div id="chart1" class="chart-container fullscreen-chart"></div>
        </section>

        <!-- Slide 2: Viz 2 -->
        <section class="slide" id="slide-2" data-title="Entity Tracking">
            <div id="chart2" class="chart-container fullscreen-chart"></div>
        </section>

        <!-- Slide 3: Viz 3 -->
        <section class="slide" id="slide-3" data-title="Geospatial Spread">
            <div id="chart3" class="chart-container fullscreen-chart"></div>
        </section>

        <!-- Slide 4: Viz 4 -->
        <section class="slide" id="slide-4" data-title="Market Dominance">
            <div id="chart4" class="chart-container fullscreen-chart"></div>
        </section>

        <!-- Slide 5: Viz 5 -->
        <section class="slide" id="slide-5" data-title="2025 Skyline">
            <div id="chart5" class="chart-container fullscreen-chart"></div>
        </section>

    </main>

    <!-- Navigation Controls -->
    <nav class="nav-controls">
        <button class="nav-btn" onclick="prevSlide()">◀ PREV</button>
        <div class="slide-indicator" id="slide-indicator">1 / 6</div>
        <button class="nav-btn" onclick="nextSlide()">NEXT ▶</button>
    </nav>

    <!-- Core Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
    <script src="bg.js"></script>
    <script src="alien.js"></script>
</body>

</html>
